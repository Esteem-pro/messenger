<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" id="meta-theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>OmniDesk Pro — Омниканальная платформа отдела продаж (Деморежим)</title>
  <style>
    :root {
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-hover: #e2e8f0;
      --bg-active: #eff6ff;
      --bg-glass: rgba(255, 255, 255, 0.88);
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --border-subtle: #f1f5f9;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #dbeafe;
      --primary-text: #ffffff;
      --wa-color: #16a34a;
      --wa-bg: #dcfce7;
      --tg-color: #0284c7;
      --tg-bg: #e0f2fe;
      --max-color: #7c3aed;
      --max-bg: #ede9fe;
      --note-bg: #fef9c3;
      --note-border: #fde047;
      --note-text: #854d0e;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 28px -4px rgba(15, 23, 42, 0.14);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg-app: #090d16;
      --bg-surface: #111827;
      --bg-subtle: #1e293b;
      --bg-hover: #334155;
      --bg-active: #1e3a8a;
      --bg-glass: rgba(17, 24, 39, 0.88);
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-color: #1e293b;
      --border-subtle: #162032;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e3a8a;
      --wa-color: #22c55e;
      --wa-bg: rgba(34, 197, 94, 0.15);
      --tg-color: #38bdf8;
      --tg-bg: rgba(56, 189, 248, 0.15);
      --max-color: #a78bfa;
      --max-bg: rgba(167, 139, 250, 0.15);
      --note-bg: rgba(234, 179, 8, 0.15);
      --note-border: rgba(234, 179, 8, 0.4);
      --note-text: #fef08a;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
      color: var(--text-main); background: var(--bg-app);
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 99px; opacity: 0.4; }

    /* Layout Shell */
    .app-shell {
      display: flex; flex-direction: column; height: 100dvh; width: 100vw; overflow: hidden;
    }

    /* Top Demo Bar */
    .top-banner {
      height: 36px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
      font-size: 12px; flex-shrink: 0; z-index: 40;
    }
    .banner-left, .banner-right { display: flex; align-items: center; gap: 10px; }
    .demo-badge {
      background: var(--warning-bg); color: var(--warning); font-weight: 600;
      padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; display: inline-flex; align-items: center; gap: 4px;
    }
    .conn-indicator {
      display: inline-flex; align-items: center; gap: 5px; font-weight: 500; cursor: pointer;
      padding: 2px 8px; border-radius: var(--radius-full); border: 1px solid var(--border-color);
    }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .conn-dot.offline { background: var(--danger); animation: pulse 1.2s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Main Workspace */
    .workspace {
      display: flex; flex: 1; min-height: 0; width: 100%; position: relative; overflow: hidden;
    }

    /* Left Navigation Sidebar */
    .nav-sidebar {
      width: 230px; background: var(--bg-surface); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; z-index: 30;
      transition: width 0.2s ease;
    }
    .brand-box {
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }
    .brand-logo {
      display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: -0.02em;
    }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
    }
    .nav-list {
      padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 10px; border-radius: var(--radius-md); color: var(--text-secondary);
      font-weight: 500; font-size: 13px; cursor: pointer; border: none; background: transparent;
      width: 100%; text-align: left; transition: all 0.15s ease; min-height: 40px;
    }
    .nav-item:hover { background: var(--bg-subtle); color: var(--text-main); }
    .nav-item.active { background: var(--bg-active); color: var(--primary); font-weight: 600; }
    .nav-item-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .nav-item-left span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-badge {
      background: var(--primary); color: #fff; font-size: 11px; font-weight: 600;
      padding: 1px 6px; border-radius: var(--radius-full); min-width: 20px; text-align: center;
    }
    .nav-badge.danger { background: var(--danger); }

    .user-switcher-box {
      padding: 10px; border-top: 1px solid var(--border-color); background: var(--bg-subtle);
    }
    .current-user-card {
      display: flex; align-items: center; gap: 9px; padding: 6px; border-radius: var(--radius-md);
      cursor: pointer; background: var(--bg-surface); border: 1px solid var(--border-color);
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--primary-light); color: var(--primary);
      display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
      flex-shrink: 0; position: relative;
    }
    .avatar.sm { width: 26px; height: 26px; font-size: 10px; }
    .avatar.lg { width: 44px; height: 44px; font-size: 15px; }
    .channel-pill-icon {
      position: absolute; bottom: -2px; right: -2px; width: 15px; height: 15px;
      border-radius: 50%; border: 2px solid var(--bg-surface); display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 800; color: #fff;
    }
    .ch-wa { background: var(--wa-color); }
    .ch-tg { background: var(--tg-color); }
    .ch-max { background: var(--max-color); }

    /* Content Area */
    .main-view {
      flex: 1; display: flex; min-width: 0; height: 100%; overflow: hidden; position: relative;
    }

    /* Inbox 3-Column Layout */
    .inbox-layout {
      display: flex; width: 100%; height: 100%; overflow: hidden;
    }
    .chat-list-col {
      width: 350px; border-right: 1px solid var(--border-color); background: var(--bg-surface);
      display: flex; flex-direction: column; flex-shrink: 0; height: 100%;
    }
    .chat-thread-col {
      flex: 1; display: flex; flex-direction: column; background: var(--bg-app); min-width: 0; height: 100%; position: relative;
    }
    .crm-drawer-col {
      width: 340px; border-left: 1px solid var(--border-color); background: var(--bg-surface);
      display: flex; flex-direction: column; flex-shrink: 0; height: 100%; overflow-y: auto;
      transition: transform 0.25s ease;
    }
    .crm-drawer-col.collapsed { display: none; }

    /* Chat List Header & Filters */
    .col-header {
      padding: 12px 14px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px;
    }
    .col-header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .col-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 12px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease; min-height: 36px;
      font-family: inherit; text-decoration: none; white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: var(--primary-text); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg-surface); color: var(--text-main); border-color: var(--border-color); }
    .btn-secondary:hover { background: var(--bg-subtle); }
    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-subtle); color: var(--text-main); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn-sm { padding: 4px 9px; font-size: 12px; min-height: 28px; border-radius: var(--radius-sm); }
    .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-md); flex-shrink: 0; }

    .search-input-wrap {
      position: relative; display: flex; align-items: center; width: 100%;
    }
    .search-input-wrap svg {
      position: absolute; left: 10px; color: var(--text-muted); width: 15px; height: 15px; pointer-events: none;
    }
    .input, .select, .textarea {
      width: 100%; padding: 8px 11px; border-radius: var(--radius-md); border: 1px solid var(--border-color);
      background: var(--bg-surface); color: var(--text-main); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); }
    .search-input { padding-left: 32px; background: var(--bg-subtle); border-color: transparent; }
    .search-input:focus { background: var(--bg-surface); border-color: var(--primary); }

    .filter-chips-row {
      display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
    }
    .filter-chips-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 4px 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 500;
      background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid transparent;
      cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
      min-height: 28px;
    }
    .chip.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); font-weight: 600; }

    /* Conversation List Items */
    .conv-list { flex: 1; overflow-y: auto; divide-y: 1px solid var(--border-subtle); }
    .conv-item {
      display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border-subtle);
      cursor: pointer; transition: background 0.12s; position: relative;
    }
    .conv-item:hover { background: var(--bg-subtle); }
    .conv-item.active { background: var(--bg-active); border-left: 3px solid var(--primary); padding-left: 11px; }
    .conv-item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .conv-row-1 { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .conv-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
    .conv-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .conv-row-2 { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .conv-preview {
      font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conv-row-3 { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: var(--radius-sm);
      font-size: 10.5px; font-weight: 600; white-space: nowrap;
    }
    .identity-pill {
      font-size: 10px; color: var(--text-muted); background: var(--bg-subtle); padding: 1px 6px;
      border-radius: 4px; font-family: var(--font-mono);
    }

    /* Thread Header */
    .thread-header {
      padding: 10px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; z-index: 10;
    }
    .thread-header-info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .thread-client-meta { min-width: 0; flex: 1; }
    .thread-client-name { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-route-bar {
      font-size: 11.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .route-badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 4px;
      font-weight: 600; font-size: 11px;
    }
    .route-wa { background: var(--wa-bg); color: var(--wa-color); }
    .route-tg { background: var(--tg-bg); color: var(--tg-color); }
    .route-max { background: var(--max-bg); color: var(--max-color); }

    /* Messages Stream */
    .messages-viewport {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    .msg-date-divider {
      align-self: center; background: var(--bg-subtle); color: var(--text-secondary);
      font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: var(--radius-full); margin: 6px 0;
    }
    .msg-bubble-wrap {
      display: flex; flex-direction: column; max-width: 76%; position: relative;
    }
    .msg-bubble-wrap.incoming { align-self: flex-start; }
    .msg-bubble-wrap.outgoing { align-self: flex-end; }
    .msg-bubble-wrap.internal { align-self: center; max-width: 88%; width: 100%; }

    .msg-bubble {
      padding: 9px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; position: relative;
      box-shadow: var(--shadow-sm); word-break: break-word;
    }
    .msg-bubble-wrap.incoming .msg-bubble {
      background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }
    .msg-bubble-wrap.outgoing .msg-bubble {
      background: var(--primary); color: #ffffff; border-bottom-right-radius: 4px;
    }
    .msg-bubble-wrap.internal .msg-bubble {
      background: var(--note-bg); color: var(--note-text); border: 1px solid var(--note-border);
      border-radius: var(--radius-md);
    }

    .msg-sender-line {
      font-size: 11px; font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; justify-content: space-between; gap: 8px; opacity: 0.85;
    }
    .msg-reply-quote {
      border-left: 3px solid currentColor; padding: 4px 8px; margin-bottom: 6px;
      background: rgba(0,0,0,0.06); border-radius: 4px; font-size: 12px; opacity: 0.9;
    }
    .msg-meta {
      display: flex; align-items: center; justify-content: flex-end; gap: 5px;
      font-size: 10.5px; margin-top: 4px; opacity: 0.8;
    }
    .msg-actions-bar {
      display: flex; gap: 4px; margin-top: 3px; opacity: 0; transition: opacity 0.15s;
    }
    .msg-bubble-wrap:hover .msg-actions-bar { opacity: 1; }
    .msg-act-btn {
      font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--bg-surface);
      border: 1px solid var(--border-color); color: var(--text-secondary); cursor: pointer;
    }
    .msg-act-btn:hover { color: var(--text-main); border-color: var(--primary); }

    /* Media Attachment inside message */
    .msg-attachment {
      margin-top: 6px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.1);
      background: rgba(0,0,0,0.04);
    }
    .msg-attachment img, .msg-attachment video {
      max-width: 260px; max-height: 200px; display: block; object-fit: cover; cursor: pointer;
    }
    .msg-doc-box {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12.5px;
    }

    /* Composer Area */
    .composer-wrap {
      background: var(--bg-surface); border-top: 1px solid var(--border-color); padding: 10px 14px;
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .composer-mode-tabs {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .mode-switch { display: flex; gap: 4px; background: var(--bg-subtle); padding: 3px; border-radius: var(--radius-md); }
    .mode-btn {
      padding: 4px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600;
      border: none; background: transparent; color: var(--text-secondary); cursor: pointer;
    }
    .mode-btn.active { background: var(--bg-surface); color: var(--text-main); box-shadow: var(--shadow-sm); }
    .mode-btn.note-active { background: var(--note-bg); color: var(--note-text); }

    .composer-From-bar {
      font-size: 11.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px;
    }
    .composer-attachments-preview {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 0;
    }
    .att-chip {
      display: flex; align-items: center; gap: 6px; background: var(--bg-subtle);
      border: 1px solid var(--border-color); padding: 4px 8px; border-radius: var(--radius-md); font-size: 12px;
    }
    .composer-row { display: flex; align-items: flex-end; gap: 8px; }
    .composer-textarea {
      flex: 1; resize: none; min-height: 40px; max-height: 110px; padding: 9px 12px;
      border-radius: var(--radius-md); border: 1px solid var(--border-color);
      background: var(--bg-subtle); color: var(--text-main); font-family: inherit; font-size: 13.5px;
    }
    .composer-textarea.note-mode {
      background: var(--note-bg); border-color: var(--note-border); color: var(--note-text);
    }

    /* Kanban Board */
    .page-container {
      flex: 1; height: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
    }
    .page-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .kanban-board {
      display: flex; gap: 14px; overflow-x: auto; flex: 1; padding-bottom: 12px; min-height: 420px;
    }
    .kanban-col {
      width: 280px; flex-shrink: 0; background: var(--bg-subtle); border-radius: var(--radius-lg);
      display: flex; flex-direction: column; max-height: 100%; border: 1px solid var(--border-color);
    }
    .kanban-col-header {
      padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between;
      font-weight: 700; font-size: 13px;
    }
    .kanban-cards {
      padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex: 1;
    }
    .kanban-card {
      background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md);
      padding: 12px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px;
      cursor: grab;
    }
    .kanban-card-price { font-weight: 700; font-size: 14px; color: var(--primary); }

    /* Grid Cards & Analytics */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px;
    }
    .stat-card {
      background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm);
    }
    .stat-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .stat-sub { font-size: 11.5px; color: var(--success); font-weight: 600; }

    /* Modal System */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-window {
      background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      width: 100%; max-width: 720px; max-height: 90dvh; display: flex; flex-direction: column;
      box-shadow: var(--shadow-lg); overflow: hidden; animation: modalIn 0.18s ease-out;
    }

// Инициализация хранилища
let State = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    console.warn('Ошибка чтения localStorage, загружаем дефолтный демо-стейт', e);
  }
  const initial = createInitialDemoState();
  saveState(initial);
  return initial;
}

function saveState(st = State) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
  } catch (e) {
    console.warn('Ошибка сохранения в localStorage', e);
  }
}

function logAction(actor, action) {
  const now = new Date();
  const time = now.toTimeString().slice(0, 5);
  State.auditLog.unshift({ id: 'log_' + Date.now(), time, actor, action });
  saveState();
}

/**
 * ============================================================================
 * UI HELPERS & NOTIFICATIONS
 * ============================================================================
 */
function showToast(text, type = 'info') {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast';
  if (type === 'danger') el.style.borderLeftColor = 'var(--danger)';
  if (type === 'success') el.style.borderLeftColor = 'var(--success)';
  if (type === 'warning') el.style.borderLeftColor = 'var(--warning)';
  el.innerHTML = `<span>${escapeHtml(text)}</span><button class="btn btn-ghost btn-sm" style="padding:2px 6px">✕</button>`;
  el.querySelector('button').onclick = () => el.remove();
  root.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 4200);
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getCurrentUser() {
  return State.users.find(u => u.id === State.currentUserId) || State.users[0];
}

function getClient(id) {
  return State.clients.find(c => c.id === id);
}

function getUser(id) {
  return State.users.find(u => u.id === id) || State.users[0];
}

function getTag(id) {
  return State.tags.find(t => t.id === id);
}

function getStage(id) {
  return State.stages.find(s => s.id === id) || State.stages[0];
}

function getChannelMeta(ch) {
  if (ch === 'whatsapp') return ChannelAdapters.WhatsAppAdapter;
  if (ch === 'telegram') return ChannelAdapters.TelegramAdapter;
  return ChannelAdapters.MaxAdapter;
}

function getFilteredConversations() {
  const f = State.filters;
  const curUser = getCurrentUser();

  return State.conversations.filter(cv => {
    const cli = getClient(cv.clientId);
    if (!cli) return false;

    // Статусные вкладки
    if (f.statusTab === 'archived') {
      if (!cv.archived) return false;
    } else if (f.statusTab === 'snoozed') {
      if (!cv.snoozed) return false;
    } else {
      if (cv.archived) return false;
    }

    if (f.statusTab === 'my' && cv.managerId !== curUser.id) return false;
    if (f.statusTab === 'unread' && cv.unread === 0) return false;
    if (f.statusTab === 'unanswered' && cv.status !== 'unanswered') return false;
    if (f.statusTab === 'waiting_client' && cv.status !== 'waiting_client') return false;
    if (f.statusTab === 'attention' && cv.status !== 'attention' && cv.priority !== 'high') return false;
    if (f.statusTab === 'favorite' && !cv.favorite) return false;

    if (f.channel !== 'all' && cv.channel !== f.channel) return false;
    if (f.managerId !== 'all' && cv.managerId !== f.managerId) return false;
    if (f.tagId !== 'all' && !(cli.tags || []).includes(f.tagId)) return false;
    if (f.stageId !== 'all' && cli.stageId !== f.stageId) return false;

    if (f.search.trim()) {
      const q = f.search.trim().toLowerCase();
      const msgs = State.messages[cv.id] || [];
      const msgMatch = msgs.some(m => (m.text || '').toLowerCase().includes(q));
      const tagMatch = (cli.tags || []).some(tid => {
        const tg = getTag(tid);
        return tg && tg.name.toLowerCase().includes(q);
      });
      const cliMatch =
        cli.name.toLowerCase().includes(q) ||
        cli.company.toLowerCase().includes(q) ||
        cli.phone.toLowerCase().includes(q) ||
        (cli.tg || '').toLowerCase().includes(q);
      if (!cliMatch && !msgMatch && !tagMatch) return false;
    }

    return true;
  }).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
}

  { id: 'pipeline', label: 'Воронка продаж', short: 'Воронка', icon: '📊' },
  { id: 'tasks', label: 'Задачи и напоминания', short: 'Задачи', icon: '⚡' },
  { id: 'analytics', label: 'Аналитика отдела', short: 'Аналитика', icon: '📈' },
  { id: 'templates', label: 'Шаблоны сообщений', short: 'Шаблоны', icon: '📋' },
  { id: 'tags', label: 'Теги и сегменты', short: 'Теги', icon: '🏷️' },
  { id: 'staff', label: 'Сотрудники и номера', short: 'Команда', icon: '🧑‍💼' },
  { id: 'integrations', label: 'Подключённые мессенджеры', short: 'Каналы', icon: '🔌' },
  { id: 'settings', label: 'Настройки и журнал', short: 'Настройки', icon: '⚙️' }
];

function renderApp() {
  renderTopUserHeader();
  renderNavigation();
  renderMainSection();
}

function renderTopUserHeader() {
  const u = getCurrentUser();
  const av = document.getElementById('cur-user-avatar');
  const nm = document.getElementById('cur-user-name');
  const rl = document.getElementById('cur-user-role');
  if (av) av.textContent = u.avatar;
  if (nm) nm.textContent = u.name;
  if (rl) rl.textContent = `${u.roleTitle} • ${u.workPhone}`;

  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  if (dot && txt) {
    dot.className = 'conn-dot' + (State.wsOnline ? '' : ' offline');
    txt.textContent = State.wsOnline ? 'Онлайн (WS)' : 'Офлайн (Очередь)';
  }
}

function renderNavigation() {
  const unreadTotal = State.conversations.reduce((acc, c) => acc + (c.archived ? 0 : c.unread), 0);
  const activeTasksCount = State.tasks.filter(t => !t.done).length;
  const overdueTasksCount = State.tasks.filter(t => !t.done && t.overdue).length;

  const dNav = document.getElementById('desktop-nav');
  if (dNav) {
    dNav.innerHTML = NAV_ITEMS.map(item => {
      let badgeHtml = '';
      if (item.id === 'inbox' && unreadTotal > 0) {
        badgeHtml = `<span class="nav-badge">${unreadTotal}</span>`;
      } else if (item.id === 'tasks' && activeTasksCount > 0) {
        badgeHtml = `<span class="nav-badge ${overdueTasksCount > 0 ? 'danger' : ''}">${activeTasksCount}</span>`;
      }
      return `
        <button class="nav-item ${State.activeSection === item.id ? 'active' : ''}" data-nav="${item.id}">
          <div class="nav-item-left">
            <span>${item.icon}</span>
            <span>${item.label}</span>
          </div>
          ${badgeHtml}
        </button>
      `;
    }).join('');
    dNav.querySelectorAll('[data-nav]').forEach(btn => {
      btn.onclick = () => {
        State.activeSection = btn.dataset.nav;
        State.mobileThreadOpen = false;
        saveState();
        renderApp();
      };
    });
  }

  // Mobile Bottom Nav (5 ключевых вкладок + меню «Ещё»)
  const mNav = document.getElementById('mobile-nav');
  if (mNav) {
    const mobileTabs = [
      NAV_ITEMS[0], // Диалоги
      NAV_ITEMS[1], // Клиенты
      NAV_ITEMS[2], // Воронка
      NAV_ITEMS[3], // Задачи
      { id: 'more_menu', short: 'Разделы', icon: '☰' }
    ];
    mNav.innerHTML = mobileTabs.map(t => {
      const isAct = State.activeSection === t.id || (t.id === 'more_menu' && !['inbox','clients','pipeline','tasks'].includes(State.activeSection));
      return `
        <button class="mob-nav-btn ${isAct ? 'active' : ''}" data-mnav="${t.id}">
          <span style="font-size:17px">${t.icon}</span>
          <span>${t.short}</span>
        </button>
      `;
    }).join('');
    mNav.querySelectorAll('[data-mnav]').forEach(btn => {
      btn.onclick = () => {
        const target = btn.dataset.mnav;
        if (target === 'more_menu') {
          openMobileSectionsSheet();
        } else {
          State.activeSection = target;
          State.mobileThreadOpen = false;
          saveState();
          renderApp();
        }
      };
    });
  }
}

function renderMainSection() {
  const view = document.getElementById('main-view');
  if (!view) return;

  switch (State.activeSection) {
    case 'inbox':
      renderInboxSection(view);
      break;
    case 'clients':
      renderClientsSection(view);
      break;
    case 'pipeline':
      renderPipelineSection(view);
      break;
    case 'tasks':
      renderTasksSection(view);
      break;
    case 'analytics':
      renderAnalyticsSection(view);
      break;
    case 'templates':
      renderTemplatesSection(view);
      break;
    case 'tags':
      renderTagsSection(view);
      break;
    case 'staff':
      renderStaffSection(view);
      break;
    case 'integrations':
      renderIntegrationsSection(view);
      break;
    case 'settings':
      renderSettingsSection(view);
      break;
    default:
      renderInboxSection(view);
  }
}

/**
 * ============================================================================
 * 1. ЕДИНЫЙ ЦЕНТР ДИАЛОГОВ (OMNICHANNEL INBOX + THREAD + CRM DRAWER)

 */
function renderInboxSection(container) {

    State.activeConvId = activeConv.id;
  }

    { id: 'all', label: 'Все' },
    { id: 'my', label: 'Мои' },
    { id: 'unread', label: 'Непрочитанные' },
    { id: 'unanswered', label: 'Без ответа' },
    { id: 'waiting_client', label: 'Ожидаем клиента' },
    { id: 'attention', label: 'Требуют внимания' },
    { id: 'favorite', label: '★ Избранные' },
    { id: 'snoozed', label: '⏳ Отложенные' },
    { id: 'archived', label: 'Архив' }
  ];

  container.innerHTML = `
    <div class="inbox-layout">
      <!-- ЛЕВАЯ КОЛОНКА: СПИСОК ДИАЛОГОВ -->
      <section class="chat-list-col">
        <div class="col-header">
          <div class="col-header-top">
            <div class="col-title">Диалоги (${filteredConvs.length})</div>
            <button class="btn btn-primary btn-sm" id="btn-new-dialog-inbox">
              <span>+ Новый диалог</span>
            </button>
          </div>

          <!-- Поиск -->
          <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="input search-input" id="inbox-search-input" placeholder="Поиск по имени, телефону, сообщениям, тегам..." value="${escapeHtml(State.filters.search)}">
          </div>

          <!-- Быстрые вкладки статусов -->
          <div class="filter-chips-row" id="status-tabs-row">
            ${statusTabs.map(t => `<button class="chip ${State.filters.statusTab === t.id ? 'active' : ''}" data-sttab="${t.id}">${t.label}</button>`).join('')}
          </div>

          <!-- Комбинированные фильтры (Канал, Менеджер, Тег) -->
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
            <select class="select" id="flt-channel" style="padding:5px 7px;font-size:11.5px">
              <option value="all">Все каналы</option>
              <option value="whatsapp" ${State.filters.channel === 'whatsapp' ? 'selected' : ''}>WhatsApp</option>
              <option value="telegram" ${State.filters.channel === 'telegram' ? 'selected' : ''}>Telegram</option>
              <option value="max" ${State.filters.channel === 'max' ? 'selected' : ''}>MAX</option>
            </select>
            <select class="select" id="flt-manager" style="padding:5px 7px;font-size:11.5px">
              <option value="all">Все менеджеры</option>
              ${State.users.map(u => `<option value="${u.id}" ${State.filters.managerId === u.id ? 'selected' : ''}>${escapeHtml(u.name.split(' ')[0])}</option>`).join('')}
            </select>
            <select class="select" id="flt-tag" style="padding:5px 7px;font-size:11.5px">
              <option value="all">Все теги</option>
              ${State.tags.map(tg => `<option value="${tg.id}" ${State.filters.tagId === tg.id ? 'selected' : ''}>${escapeHtml(tg.name)}</option>`).join('')}
            </select>
          </div>

          <!-- Сохранённые представления -->
          <div class="filter-chips-row">
            ${State.savedFilterViews.map(sv => `<button class="chip" data-savedview="${sv.id}" style="font-size:11px">${escapeHtml(sv.name)}</button>`).join('')}
            <button class="chip" id="btn-save-current-filter" style="font-size:11px;color:var(--primary)">+ Сохранить фильтр</button>
            <button class="chip" id="btn-reset-filters" style="font-size:11px">Сброс</button>
          </div>
        </div>

        <!-- Список чатов -->
        <div class="conv-list" id="conv-list-items">
          ${filteredConvs.length === 0 ? `
            <div style="padding:36px 18px;text-align:center;color:var(--text-muted)">
              <div style="font-size:28px;margin-bottom:8px">📭</div>
              <div style="font-weight:600;color:var(--text-secondary)">Диалоги не найдены</div>
              <div style="font-size:12px;margin-top:4px">Измените параметры фильтрации или начните новый диалог с клиентом.</div>

          ` : filteredConvs.map(cv => renderConvListItem(cv, activeConv && cv.id === activeConv.id)).join('')}

      <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА: ОТКРЫТАЯ ПЕРЕПИСКА -->
      <section class="chat-thread-col ${State.mobileThreadOpen ? 'mobile-open' : ''}" id="chat-thread-col">
        ${activeConv ? renderActiveThreadHTML(activeConv) : `<div style="margin:auto;color:var(--text-muted)">Выберите диалог слева</div>`}

        ${activeConv ? renderCrmDrawerHTML(activeConv) : ''}

  bindInboxEvents(activeConv);

function renderMessageBubbleHTML(m, cv, cli) {
  const chMeta = getChannelMeta(cv.channel);
  const wrapClass = m.dir === 'in' ? 'incoming' : (m.dir === 'note' ? 'internal' : 'outgoing');
  const senderUser = m.senderId ? getUser(m.senderId) : getCurrentUser();

  // Честные возможности редактирования и удаления в зависимости от мессенджера
  const canRemoteEdit = m.dir === 'out' && chMeta.capabilities.remoteEditMessage;
  const canRemoteDelete = m.dir === 'out' && chMeta.capabilities.remoteDeleteMessage;

  let attachmentHtml = '';
  if (m.attachment) {
    if (m.attachment.type === 'img') {
      attachmentHtml = `
        <div class="msg-attachment">
          <div style="padding:18px;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;font-size:12px;text-align:center">
            🖼️ <b>${escapeHtml(m.attachment.name)}</b><br>
            <span style="opacity:0.8">${escapeHtml(m.attachment.previewTitle || 'Изображение (Локальное демо-хранилище)')} • ${escapeHtml(m.attachment.size)}</span>
          </div>
        </div>
      `;
    } else {
      attachmentHtml = `
        <div class="msg-attachment">
          <div class="msg-doc-box">
            <span style="font-size:18px">📄</span>
            <div>
              <div style="font-weight:600">${escapeHtml(m.attachment.name)}</div>
              <div style="font-size:11px;opacity:0.75">${escapeHtml(m.attachment.size)} • Локальный демофайл</div>
            </div>
          </div>
        </div>
      `;
    }
  }

  return `
    <div class="msg-bubble-wrap ${wrapClass}" data-msgid="${m.id}">
      <div class="msg-bubble">
        <div class="msg-sender-line">
          <span>${m.dir === 'in' ? escapeHtml(cli.name) : (m.dir === 'note' ? `🔒 Заметка • ${escapeHtml(senderUser.name)}` : `${escapeHtml(senderUser.name)} (${chMeta.shortCode})`)}</span>
          ${m.edited ? '<span>(изменено)</span>' : ''}
        </div>
        ${m.replyToText ? `<div class="msg-reply-quote">${escapeHtml(m.replyToText)}</div>` : ''}
        <div>${escapeHtml(m.text)}</div>
        ${attachmentHtml}
        <div class="msg-meta">
          <span>${escapeHtml(m.time)}</span>
          ${m.dir === 'out' ? `<span>${m.status === 'queued' ? '⏳ В очереди' : '✓✓ Прочитано'}</span>` : ''}
        </div>
      </div>

      <div class="msg-actions-bar">
        <button class="msg-act-btn" data-msgact="reply" data-mid="${m.id}">Ответить</button>
        <button class="msg-act-btn" data-msgact="copy" data-mid="${m.id}">Копировать</button>
        ${m.dir === 'out' ? (
          canRemoteEdit
            ? `<button class="msg-act-btn" data-msgact="edit" data-mid="${m.id}">Изменить в ${chMeta.shortCode}</button>`
            : `<button class="msg-act-btn" data-msgact="edit_blocked" data-mid="${m.id}" title="Официальный ${chMeta.title} не поддерживает универсальное редактирование">Изменить (недоступно в API)</button>`
        ) : ''}
        <button class="msg-act-btn" data-msgact="delete" data-mid="${m.id}">
          ${canRemoteDelete ? `Удалить в ${chMeta.shortCode}` : 'Скрыть локально в CRM'}
        </button>
      </div>
    </div>
  `;
}

  const clientTasks = State.tasks.filter(t => t.clientId === cli.id && !t.done);

  return `

      <button class="btn btn-ghost btn-sm" id="btn-close-crm-drawer">✕</button>
    </div>

    <div style="padding:14px;display:flex;flex-direction:column;gap:14px">
      <!-- Профиль клиента -->
      <div style="display:flex;align-items:center;gap:10px">
        <div class="avatar lg">${escapeHtml(cli.name.split(' ').map(x => x[0]).join('').slice(0, 2))}</div>

function bindInboxEvents(activeConv) {
  const btnNew = document.getElementById('btn-new-dialog-inbox');
  if (btnNew) btnNew.onclick = () => openNewDialogModal();

  const searchInp = document.getElementById('inbox-search-input');
  if (searchInp) {
    searchInp.oninput = (e) => {
      State.filters.search = e.target.value;
      renderMainSection();
      const restored = document.getElementById('inbox-search-input');
      if (restored) { restored.focus(); restored.setSelectionRange(restored.value.length, restored.value.length); }
    };
  }

  document.querySelectorAll('[data-sttab]').forEach(btn => {
    btn.onclick = () => {
      State.filters.statusTab = btn.dataset.sttab;
      saveState();
      renderMainSection();
    };
  });

  const fltCh = document.getElementById('flt-channel');
  if (fltCh) fltCh.onchange = (e) => { State.filters.channel = e.target.value; saveState(); renderMainSection(); };
  const fltMgr = document.getElementById('flt-manager');
  if (fltMgr) fltMgr.onchange = (e) => { State.filters.managerId = e.target.value; saveState(); renderMainSection(); };
  const fltTag = document.getElementById('flt-tag');
  if (fltTag) fltTag.onchange = (e) => { State.filters.tagId = e.target.value; saveState(); renderMainSection(); };

  document.querySelectorAll('[data-savedview]').forEach(btn => {
    btn.onclick = () => {
      const sv = State.savedFilterViews.find(x => x.id === btn.dataset.savedview);
      if (sv) {
        State.filters = { ...sv.filters };
        saveState();
        renderMainSection();
        showToast(`Применён фильтр «${sv.name}»`);
      }
    };
  });

  const btnSaveFlt = document.getElementById('btn-save-current-filter');
  if (btnSaveFlt) {
    btnSaveFlt.onclick = () => {
      const name = prompt('Название для сохранения текущей комбинации фильтров:', 'Моя подборка');
      if (name && name.trim()) {
        State.savedFilterViews.push({ id: 'sv_' + Date.now(), name: name.trim(), filters: { ...State.filters } });
        saveState();
        renderMainSection();
        showToast('Подборка фильтров сохранена', 'success');
      }
    };
  }

  const btnResetFlt = document.getElementById('btn-reset-filters');
  if (btnResetFlt) {
    btnResetFlt.onclick = () => {
      State.filters = { statusTab: 'all', channel: 'all', managerId: 'all', tagId: 'all', stageId: 'all', search: '' };
      saveState();
      renderMainSection();
    };
  }

  document.querySelectorAll('[data-convid]').forEach(item => {
    item.onclick = () => {
      const id = item.dataset.convid;
      State.activeConvId = id;
      State.mobileThreadOpen = true;
      const cv = State.conversations.find(x => x.id === id);
      if (cv && cv.unread > 0) cv.unread = 0;
      saveState();
      renderApp();
      scrollToBottomMessages();
    };
  });

  const btnBack = document.getElementById('btn-mobile-back-list');
  if (btnBack) {
    btnBack.onclick = () => {
      State.mobileThreadOpen = false;
      renderMainSection();
    };
  }

  const btnToggleCrm = document.getElementById('btn-toggle-crm-drawer');
  if (btnToggleCrm) {
    btnToggleCrm.onclick = () => {
      State.crmDrawerOpen = !State.crmDrawerOpen;
      saveState();
      renderMainSection();
    };
  }
  const btnCloseCrm = document.getElementById('btn-close-crm-drawer');
  if (btnCloseCrm) {
    btnCloseCrm.onclick = () => {
      State.crmDrawerOpen = false;
      saveState();
      renderMainSection();
    };
  }

  if (!activeConv) return;

  // Режимы композера
  const modeReply = document.getElementById('mode-btn-reply');
  const modeNote = document.getElementById('mode-btn-note');
  if (modeReply) modeReply.onclick = () => { State.composerMode = 'reply'; renderMainSection(); };
  if (modeNote) modeNote.onclick = () => { State.composerMode = 'note'; renderMainSection(); };

  const cancelReply = document.getElementById('btn-cancel-reply');
  if (cancelReply) cancelReply.onclick = () => { State.replyingToMsg = null; renderMainSection(); };

  // Сохранение черновика и отправка
  const compInput = document.getElementById('composer-input');
  if (compInput) {
    compInput.oninput = (e) => {
      State.drafts[activeConv.id] = e.target.value;
    };
    compInput.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCurrentMessage(activeConv);
      }
    };
  }

  const btnSend = document.getElementById('btn-send-msg');
  if (btnSend) btnSend.onclick = () => sendCurrentMessage(activeConv);

  // Прикрепление реальных файлов из браузера
  const btnAttach = document.getElementById('btn-attach-file');
  const fileInp = document.getElementById('global-file-input');
  if (btnAttach && fileInp) {
    btnAttach.onclick = () => fileInp.click();
    fileInp.onchange = (e) => {
      const files = Array.from(e.target.files || []);
      files.forEach(f => {
        const sizeKB = Math.max(1, Math.round(f.size / 1024));
        const isImg = f.type.startsWith('image/');
        State.pendingAttachments.push({
          type: isImg ? 'img' : 'doc',
          name: f.name,
          size: sizeKB > 1024 ? (sizeKB / 1024).toFixed(1) + ' МБ' : sizeKB + ' КБ',
          previewTitle: 'Локальный файл браузера (Демо)'
        });
      });
      fileInp.value = '';
      renderMainSection();
    };
  }

  document.querySelectorAll('[data-rmatt]').forEach(b => {
    b.onclick = () => {
      State.pendingAttachments.splice(Number(b.dataset.rmatt), 1);
      renderMainSection();
    };
  });

  // Кнопка выбора шаблона в переписке
  const btnPickTpl = document.getElementById('btn-pick-template');
  if (btnPickTpl) btnPickTpl.onclick = () => openTemplatePickerModal(activeConv);

  // AI-помощник (Демо)
  const btnAi = document.getElementById('btn-ai-assist');
  if (btnAi) btnAi.onclick = () => openAiSummaryModal(activeConv);

  // Передача диалога другому менеджеру
  const btnReassign = document.getElementById('btn-reassign-conv');
  if (btnReassign) btnReassign.onclick = () => openReassignModal(activeConv);

  // Действия над сообщениями (Ответ, Копирование, Редактирование, Удаление)
  document.querySelectorAll('[data-msgact]').forEach(btn => {
    btn.onclick = () => {
      const act = btn.dataset.msgact;
      const mid = btn.dataset.mid;
      const list = State.messages[activeConv.id] || [];
      const msg = list.find(x => x.id === mid);
      if (!msg) return;

      if (act === 'reply') {
        State.replyingToMsg = msg;
        renderMainSection();
      } else if (act === 'copy') {
        navigator.clipboard?.writeText(msg.text);
        showToast('Текст сообщения скопирован');
      } else if (act === 'edit_blocked') {
        showToast('В официальном WhatsApp Business Cloud API редактирование отправленных сообщений не поддерживается', 'warning');
      } else if (act === 'edit') {
        const updated = prompt('Редактирование сообщения в ' + activeConv.channel.toUpperCase() + ':', msg.text);
        if (updated && updated.trim()) {
          msg.text = updated.trim();
          msg.edited = true;
          saveState();
          renderMainSection();
          showToast('Сообщение отредактировано в мессенджере', 'success');
        }
      } else if (act === 'delete') {
        const chMeta = getChannelMeta(activeConv.id ? activeConv.channel : 'whatsapp');
        const idx = list.findIndex(x => x.id === mid);
        if (idx >= 0) {
          list.splice(idx, 1);
          saveState();
          renderMainSection();
          showToast(
            chMeta.capabilities.remoteDeleteMessage && msg.dir === 'out'
              ? 'Сообщение удалено у обоих собеседников'
              : 'Сообщение скрыто локально в CRM (в мессенджере клиента сохраняется)',
            'info'
          );
        }
      }
    };
  });

  // CRM Drawer события
  const stSelect = document.getElementById('crm-stage-select');
  if (stSelect) {
    stSelect.onchange = (e) => {
      const cli = getClient(activeConv.clientId);
      cli.stageId = e.target.value;
      logAction(getCurrentUser().name, `Изменил этап сделки клиента ${cli.name} на «${getStage(cli.stageId).name}»`);
      saveState();
      renderMainSection();
      showToast('Этап воронки обновлён', 'success');
    };
  }

  const mgrSelect = document.getElementById('crm-manager-select');
  if (mgrSelect) {
    mgrSelect.onchange = (e) => {
      const cli = getClient(activeConv.clientId);
      cli.managerId = e.target.value;
      activeConv.managerId = e.target.value;
      logAction(getCurrentUser().name, `Назначил ответственным за ${cli.name} сотрудника ${getUser(cli.managerId).name}`);
      saveState();
      renderMainSection();
      showToast('Ответственный менеджер изменён', 'success');
    };
  }

  document.querySelectorAll('[data-rmtag]').forEach(el => {
    el.onclick = () => {
      const cli = getClient(activeConv.clientId);
      cli.tags = (cli.tags || []).filter(t => t !== el.dataset.rmtag);
      saveState();
      renderMainSection();
    };
  });

  const btnManageTags = document.getElementById('btn-crm-manage-tags');
  if (btnManageTags) btnManageTags.onclick = () => openAssignTagsModal(getClient(activeConv.clientId));

  document.querySelectorAll('[data-switchconv]').forEach(el => {
    el.onclick = () => {
      State.activeConvId = el.dataset.switchconv;
      saveState();
      renderMainSection();
    };
  });

  const btnAddTask = document.getElementById('btn-crm-add-task');
  if (btnAddTask) btnAddTask.onclick = () => openNewTaskModal(activeConv.clientId, activeConv.id);

  document.querySelectorAll('[data-donetask]').forEach(chk => {
    chk.onchange = () => {
      const t = State.tasks.find(x => x.id === chk.dataset.donetask);
      if (t) {
        t.done = true;
        saveState();
        renderApp();
        showToast('Задача отмечена выполненной', 'success');
      }
    };
  });

  scrollToBottomMessages();
}

function scrollToBottomMessages() {
  const vp = document.getElementById('messages-viewport');
  if (vp) vp.scrollTop = vp.scrollHeight;
}

function sendCurrentMessage(cv) {
  const inp = document.getElementById('composer-input');
  const text = (inp ? inp.value : '').trim();
  if (!text && State.pendingAttachments.length === 0) return;

  // Проверка 24-часового окна для WhatsApp при обычной отправке
  if (State.composerMode === 'reply' && cv.channel === 'whatsapp' && !cv.windowOpen && !text.startsWith('[HSM-ШАБЛОН')) {
    showToast('Внимание: 24-часовое окно в WhatsApp закрыто. Выберите одобренный HSM-шаблон по кнопке 📋.', 'warning');
    openTemplatePickerModal(cv);
    return;
  }

  const now = new Date();
  const timeStr = now.toTimeString().slice(0, 5);
  const curUser = getCurrentUser();

  const newMsg = {
    id: 'msg_' + Date.now(),
    dir: State.composerMode === 'note' ? 'note' : 'out',
    senderId: curUser.id,
    time: timeStr,
    text: text || (State.pendingAttachments[0] ? `Вложение: ${State.pendingAttachments[0].name}` : ''),
    status: State.wsOnline ? 'read' : 'queued',
    replyToText: State.replyingToMsg ? State.replyingToMsg.text : null,
    attachment: State.pendingAttachments[0] || null
  };

  if (!State.messages[cv.id]) State.messages[cv.id] = [];
  State.messages[cv.id].push(newMsg);

  cv.updatedAt = timeStr;
  if (State.composerMode === 'reply') {
    cv.status = 'waiting_client';
    cv.unread = 0;
    if (cv.channel === 'whatsapp') cv.windowOpen = true;
  }

  State.drafts[cv.id] = '';
  State.replyingToMsg = null;
  State.pendingAttachments = [];

  const cli = getClient(cv.clientId);
  logAction(curUser.name, `${State.composerMode === 'note' ? 'Добавил внутреннюю заметку' : 'Отправил сообщение (' + cv.channel.toUpperCase() + ')'} клиенту ${cli.name}`);
  saveState();
  renderApp();
}

  const discStage = document.getElementById('nd-discovery-stage');
  const compStage = document.getElementById('nd-composer-stage');
  const btnExec = document.getElementById('btn-nd-execute');

  // Проверка дублей в реальном времени
  const checkDuplicateLive = () => {
    const val = inpId.value.trim();
    const digits = val.replace(/\D/g, '');
    if (val.length < 4) { dupAlert.textContent = ''; return; }
    const found = State.clients.find(c =>
      (digits.length >= 6 && c.phone.replace(/\D/g, '').includes(digits)) ||
      (val.startsWith('@') && c.tg && c.tg.toLowerCase() === val.toLowerCase())
    );
    if (found) {
      dupAlert.innerHTML = `⚠️ Совпадение в базе CRM: <b>${escapeHtml(found.name)}</b> (${escapeHtml(found.company)}). Новый диалог будет привязан к существующей карточке.`;
      if (!inpName.value) inpName.value = found.name;
      if (!inpComp.value) inpComp.value = found.company;
    } else {
      dupAlert.textContent = '';
    }
  };

  inpId.oninput = checkDuplicateLive;

  // Выбор одного из 6 тестовых сценариев
  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.onclick = () => {
      const p = ChannelDiscoveryService.demoPresets.find(x => x.id === btn.dataset.preset);
      if (!p) return;
      activePresetId = p.id;
      inpId.value = p.input;
      inpName.value = p.name;
      inpComp.value = p.company;
      const hintBox = document.getElementById('preset-hint-box');
      hintBox.style.display = 'block';
      hintBox.textContent = '💡 Сценарий: ' + p.scenarioHint;
      checkDuplicateLive();
      runDiscovery();
    };
  });

  async function runDiscovery() {
    const identifier = inpId.value.trim();
    if (!identifier) {
      showToast('Введите номер телефона или @username клиента', 'warning');
      return;
    }
    const mgr = getUser(selMgr.value);
    discStage.style.display = 'flex';
    discStage.innerHTML = `<div style="padding:18px;text-align:center;color:var(--text-secondary)">⏳ Опрос адаптеров WhatsApp Cloud API, Telegram и MAX для сотрудника <b>${escapeHtml(mgr.name)}</b>...</div>`;
    compStage.style.display = 'none';
    btnExec.disabled = true;

    discoveryResult = await ChannelDiscoveryService.discoverContactChannels(identifier, mgr, activePresetId);
    activePresetId = null;

    // Выбираем по умолчанию первый канал, в котором технически разрешено начать диалог
    selectedChannelItem = discoveryResult.channels.find(c => c.canInitiate) || discoveryResult.channels[0];
    renderDiscoveryCards();
    renderStep4Composer();
  }

  function renderDiscoveryCards() {
    discStage.innerHTML = `
      <div style="font-size:12.5px;font-weight:700">Выберите канал коммуникации (выделены технически доступные для инициации):</div>
      <div class="discovery-grid">
        ${discoveryResult.channels.map(ch => {
          const meta = getChannelMeta(ch.channel);
          const isSel = selectedChannelItem && selectedChannelItem.channel === ch.channel;
          let badgeClass = 'status-err';
          let badgeText = 'Ограничение API';
          if (ch.canInitiate && ch.initiationMode === 'freeform') {
            badgeClass = 'status-ok';
            badgeText = 'Можно писать сразу';
          } else if (ch.canInitiate && ch.initiationMode === 'approved_template') {
            badgeClass = 'status-warn';
            badgeText = 'Только HSM-шаблон';
          } else if (ch.initiationMode === 'external_deeplink' || ch.initiationMode === 'customer_initiated') {
            badgeClass = 'status-warn';
            badgeText = 'Клиент пишет первым';
          }

          return `
            <div class="discovery-card ${isSel ? 'selected' : ''} ${!ch.canInitiate ? 'disabled-init' : ''}" data-discch="${ch.channel}">
              <div style="display:flex;align-items:center;justify-content:space-between">
                <span class="route-badge ${meta.badgeClass}">${meta.shortCode} • ${escapeHtml(ch.channel.toUpperCase())}</span>
                <span class="disc-status-badge ${badgeClass}">${badgeText}</span>
              </div>
              <div style="font-size:11.5px;font-weight:600;color:var(--text-main)">
                Аккаунт: ${escapeHtml(ch.businessIdentityLabel)}
              </div>
              <div style="font-size:11.5px;color:var(--text-secondary);line-height:1.4">
                ${escapeHtml(ch.reason)}
              </div>
              <div style="font-size:10.5px;color:var(--text-muted);margin-top:auto;font-family:var(--font-mono)">
                Режим: ${escapeHtml(ch.initiationMode)}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    discStage.querySelectorAll('[data-discch]').forEach(card => {
      card.onclick = () => {
        selectedChannelItem = discoveryResult.channels.find(x => x.channel === card.dataset.discch);
        renderDiscoveryCards();
        renderStep4Composer();
      };
    });
  }

  function renderStep4Composer() {
    if (!selectedChannelItem) return;
    compStage.style.display = 'flex';
    const ch = selectedChannelItem;
    const mgr = getUser(selMgr.value);
    const clientNameVal = inpName.value.trim() || 'Уважаемый клиент';
    const companyVal = inpComp.value.trim() || 'Ателье Премиум';

    if (ch.canInitiate && (ch.initiationMode === 'freeform' || ch.initiationMode === 'existing_chat_only')) {
      btnExec.disabled = false;
      btnExec.textContent = ch.existingConversation ? 'Открыть диалог и отправить' : `Отправить в ${ch.channel.toUpperCase()} и создать диалог`;
      compStage.innerHTML = `
        <div style="font-size:12.5px;font-weight:700;color:var(--success)">
          ✓ Прямая отправка разрешена (с рабочего аккаунта ${escapeHtml(ch.businessIdentityLabel)})
        </div>
        <textarea class="textarea" id="nd-freeform-text" rows="3" placeholder="Введите первое сообщение клиенту...">${escapeHtml(`Здравствуйте, ${clientNameVal}! Меня зовут ${mgr.name.split(' ')[0]}, мы получили ваш запрос по ${companyVal}. Удобно обсудить детали здесь?`)}</textarea>
      `;
    } else if (ch.canInitiate && ch.initiationMode === 'approved_template') {
      btnExec.disabled = false;
      btnExec.textContent = 'Отправить HSM-шаблон WhatsApp';
      const waTemplates = State.templates.filter(t => t.type === 'whatsapp_hsm');
      const curTpl = waTemplates.find(t => t.id === selectedTemplateId) || waTemplates[0];
      const previewText = (curTpl ? curTpl.body : '')
        .replace('{client_name}', clientNameVal)
        .replace('{manager_name}', mgr.name)
        .replace('{company}', 'OmniDesk Luxury Atelier')
        .replace('{product}', companyVal)
        .replace('{price}', '420 000 ₽');

      compStage.innerHTML = `
        <div style="font-size:12.5px;font-weight:700;color:var(--warning)">
          ⚠️ Для начала переписки в WhatsApp вне 24ч окна требуется утверждённый шаблон (HSM) и согласие клиента (opt-in)
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label style="font-size:11.5px;font-weight:600">Выберите одобренный шаблон WhatsApp:</label>
            <select class="select" id="nd-wa-tpl-select" style="margin-top:4px">
              ${waTemplates.map(t => `<option value="${t.id}" ${t.id === curTpl.id ? 'selected' : ''}>${escapeHtml(t.title)}</option>`).join('')}
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:8px;padding-top:18px">
            <input type="checkbox" id="nd-wa-consent" checked>
            <label for="nd-wa-consent" style="font-size:12px;font-weight:600">Клиент дал согласие (opt-in) на получение сообщений</label>
          </div>
        </div>
        <div style="background:var(--bg-subtle);padding:10px;border-radius:8px;font-size:12.5px">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Предпросмотр HSM-шаблона перед отправкой с номера <b>${escapeHtml(ch.businessIdentityLabel)}</b>:</div>
          <div id="nd-tpl-preview" style="font-weight:500">${escapeHtml(previewText)}</div>
        </div>
      `;

      document.getElementById('nd-wa-tpl-select').onchange = (e) => {
        selectedTemplateId = e.target.value;
        renderStep4Composer();
      };
    } else {
      // Канал не позволяет написать первым с сервера — честно блокируем кнопку ложной отправки
      btnExec.disabled = true;
      btnExec.textContent = 'Отправка первым недоступна API';
      const inviteUrl = ch.channel === 'telegram'
        ? `https://t.me/${mgr.identities.telegram.username.replace('@', '')}?start=crm_${Date.now().toString().slice(-4)}`
        : `https://max.ru/u/${mgr.identities.max.account}?ref=invite`;

      compStage.innerHTML = `
        <div style="background:var(--danger-bg);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:12.5px;font-weight:600">
          ⛔ Ложная отправка заблокирована: ${escapeHtml(ch.reason)}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-subtle);padding:10px 12px;border-radius:8px;flex-wrap:wrap">
          <div style="font-size:12px">
            <b>Персональная ссылка-приглашение для клиента:</b><br>
            <span style="font-family:var(--font-mono);color:var(--primary)">${escapeHtml(inviteUrl)}</span>
          </div>
          <button class="btn btn-secondary btn-sm" id="btn-copy-invite-link">Скопировать ссылку</button>
        </div>
      `;
      const copyBtn = document.getElementById('btn-copy-invite-link');
      if (copyBtn) {
        copyBtn.onclick = () => {
          navigator.clipboard?.writeText(inviteUrl);
          showToast('Ссылка-приглашение скопирована в буфер обмена', 'success');
        };
      }
    }
  }

  document.getElementById('btn-run-discovery').onclick = runDiscovery;

  // Сохранение только в CRM без отправки сообщения
  document.getElementById('btn-nd-save-crm-only').onclick = () => {
    const idVal = inpId.value.trim();
    if (!idVal) { showToast('Укажите телефон или @username клиента', 'warning'); return; }
    const cli = ensureClientCreated(idVal, inpName.value.trim(), inpComp.value.trim(), selMgr.value);
    close();
    State.activeSection = 'clients';
    saveState();
    renderApp();
    showToast(`Карточка «${cli.name}» сохранена в CRM без ложной отправки сообщения`, 'success');
  };

  // Этап 4 и 5: Создание клиента, диалога и отправка первого сообщения
  btnExec.onclick = () => {
    if (!selectedChannelItem || !selectedChannelItem.canInitiate) return;

    if (selectedChannelItem.initiationMode === 'approved_template') {
      const consentChk = document.getElementById('nd-wa-consent');
      if (consentChk && !consentChk.checked) {
        showToast('Для отправки шаблона WhatsApp необходимо подтвердить наличие opt-in согласия клиента', 'danger');
        return;
      }
    }

    const cli = ensureClientCreated(inpId.value.trim(), inpName.value.trim(), inpComp.value.trim(), selMgr.value);
    let conv = selectedChannelItem.existingConversation;

    if (!conv) {
      conv = {
        id: 'conv_' + Date.now(),
        clientId: cli.id,
        channel: selectedChannelItem.channel,
        managerId: selMgr.value,
        businessIdentityId: selectedChannelItem.businessIdentityId,
        unread: 0,
        status: 'waiting_client',
        priority: 'high',
        pinned: true,
        favorite: false,
        archived: false,
        snoozed: false,
        windowOpen: selectedChannelItem.initiationMode === 'freeform',
        updatedAt: new Date().toTimeString().slice(0, 5),
        dateGroup: 'Сегодня'
      };
      State.conversations.unshift(conv);
      State.messages[conv.id] = [];
    }

    let msgText = '';
    if (selectedChannelItem.initiationMode === 'approved_template') {
      const prevEl = document.getElementById('nd-tpl-preview');
      msgText = `[HSM-ШАБЛОН WHATSAPP] ` + (prevEl ? prevEl.textContent : '');
    } else {
      const freeEl = document.getElementById('nd-freeform-text');
      msgText = freeEl ? freeEl.value.trim() : 'Здравствуйте!';
    }

    State.messages[conv.id].push({
      id: 'msg_' + Date.now(),
      dir: 'out',
      senderId: selMgr.value,
      time: new Date().toTimeString().slice(0, 5),
      text: msgText,
      status: 'read'
    });

    State.activeSection = 'inbox';
    State.activeConvId = conv.id;
    State.mobileThreadOpen = true;
    logAction(getUser(selMgr.value).name, `Начал новый диалог с клиентом ${cli.name} в канале ${conv.channel.toUpperCase()}`);
    saveState();
    close();
    renderApp();
    showToast(`Диалог с ${cli.name} создан и открыт`, 'success');
  };

  if (prefillPhone) runDiscovery();
}

function ensureClientCreated(identifier, name, company, managerId) {
  const digits = identifier.replace(/\D/g, '');
  const isUser = identifier.startsWith('@');
  let existing = State.clients.find(c =>
    (digits.length >= 6 && c.phone.replace(/\D/g, '').includes(digits)) ||
    (isUser && c.tg && c.tg.toLowerCase() === identifier.toLowerCase())
  );
  if (existing) return existing;

  const newCli = {
    id: 'c_' + Date.now(),
    name: name || (isUser ? identifier : 'Новый клиент ' + identifier.slice(-4)),
    company: company || 'Индивидуальный заказ',
    phone: isUser ? '+7 (900) 000-00-00' : identifier,
    tg: isUser ? identifier : '',
    maxId: '',
    managerId,
    stageId: 'st_new',
    dealAmount: 250000,
    tags: ['t_new'],
    source: 'Исходящий диалог менеджера',
    nextStep: 'Квалифицировать потребность после первого касания',
    purchases: []
  };
  State.clients.unshift(newCli);
  return newCli;
}

/**
 * ============================================================================
 * 2. БАЗА КЛИЕНТОВ (CRM + РУЧНОЕ СВЯЗЫВАНИЕ КОНТАКТОВ)
 * ============================================================================
 */
function renderClientsSection(container) {
  container.innerHTML = `
    <div class="page-container">
      <div class="page-header">
        <div>
          <h2 style="font-size:20px;font-weight:800">База клиентов (${State.clients.length})</h2>

        </div>

          <button class="btn btn-secondary" id="btn-manual-merge">🔗 Ручное связывание контактов</button>

        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">
        ${State.clients.map(cli => {

                </div>

              </div>

              <div style="font-size:12px;font-family:var(--font-mono);color:var(--text-secondary)">
                📞 ${escapeHtml(cli.phone)} ${cli.tg ? `• ✈️ ${escapeHtml(cli.tg)}` : ''}

              <div style="display:flex;gap:4px;flex-wrap:wrap">

                  ${convs[0] ? `<button class="btn btn-secondary btn-sm" data-opencli-conv="${convs[0].id}">Открыть чат (${convs.length})</button>` : ''}
                  <button class="btn btn-primary btn-sm" data-write-cli="${cli.phone}" data-write-name="${escapeHtml(cli.name)}">Написать</button>

            </div>
          `;

      </div>
    </div>

  document.getElementById('btn-clients-new-dialog').onclick = () => openNewDialogModal();
  document.getElementById('btn-manual-merge').onclick = () => {
    showToast('Ручное связывание: выберите двух клиентов для объединения их переписок WhatsApp, Telegram и MAX под одной CRM-карточкой', 'info');
  };
  container.querySelectorAll('[data-opencli-conv]').forEach(b => {
    b.onclick = () => {
      State.activeConvId = b.dataset.opencliConv;
      State.activeSection = 'inbox';
      State.mobileThreadOpen = true;
      saveState();
      renderApp();

  container.querySelectorAll('[data-write-cli]').forEach(b => {

}

/**
 * ============================================================================
 * 4. ВОРОНКА ПРОДАЖ (ИНТЕРАКТИВНЫЙ KANBAN С СИНХРОНИЗАЦИЕЙ)
 * ============================================================================
 */
function renderPipelineSection(container) {
  const totalPipelineAmount = State.clients.reduce((acc, c) => acc + c.dealAmount, 0);

  container.innerHTML = `
    <div class="page-container" style="overflow:hidden">
      <div class="page-header">
        <div>
          <h2 style="font-size:20px;font-weight:800">Воронка продаж (Kanban)</h2>
          <div style="font-size:12.5px;color:var(--text-secondary)">Общий объём сделок в воронке: <b>${totalPipelineAmount.toLocaleString('ru-RU')} ₽</b> • Перетащите карточку или смените этап</div>
        </div>
        <button class="btn btn-primary" id="btn-kanban-new">+ Новая сделка / Диалог</button>
      </div>

      <div class="kanban-board">
        ${State.stages.map(stage => {
          const stageClients = State.clients.filter(c => c.stageId === stage.id);
          const stageSum = stageClients.reduce((a, b) => a + b.dealAmount, 0);
          return `
            <div class="kanban-col" data-stagecol="${stage.id}">
              <div class="kanban-col-header">
                <span>${escapeHtml(stage.name)} (${stageClients.length})</span>
                <span style="color:var(--primary);font-size:12px">${(stageSum / 1000).toFixed(0)} тыс. ₽</span>
              </div>
              <div class="kanban-cards">
                ${stageClients.map(cli => {
                  const mgr = getUser(cli.managerId);
                  const cv = State.conversations.find(x => x.clientId === cli.id);
                  const chMeta = getChannelMeta(cv ? cv.channel : 'whatsapp');
                  return `
                    <div class="kanban-card" draggable="true" data-kcard="${cli.id}">
                      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">
                        <div style="font-weight:700;font-size:13.5px">${escapeHtml(cli.name)}</div>
                        <span class="route-badge ${chMeta.badgeClass}">${chMeta.shortCode}</span>
                      </div>
                      <div style="font-size:11.5px;color:var(--text-secondary)">${escapeHtml(cli.company)}</div>
                      <div class="kanban-card-price">${cli.dealAmount.toLocaleString('ru-RU')} ₽</div>
                      <div style="display:flex;gap:4px;flex-wrap:wrap">
                        ${(cli.tags || []).slice(0, 2).map(tid => {
                          const tg = getTag(tid);
                          return tg ? `<span class="tag-pill" style="background:${tg.bg};color:${tg.color}">${escapeHtml(tg.name)}</span>` : '';
                        }).join('')}
                      </div>
                      <div style="font-size:11px;color:var(--text-muted)">След. шаг: ${escapeHtml(cli.nextStep)}</div>
                      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:6px;border-top:1px solid var(--border-subtle)">
                        <span style="font-size:11px;font-weight:600">${escapeHtml(mgr.avatar)} ${escapeHtml(mgr.name.split(' ')[0])}</span>
                        <select class="select" data-Quickstage="${cli.id}" style="width:auto;padding:2px 6px;font-size:11px;min-height:26px">
                          ${State.stages.map(s => `<option value="${s.id}" ${s.id === cli.stageId ? 'selected' : ''}>→ ${escapeHtml(s.name)}</option>`).join('')}
                        </select>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  document.getElementById('btn-kanban-new').onclick = () => openNewDialogModal();

  // Мобильное и десктопное быстрое переключение этапа через select
  container.querySelectorAll('[data-quickstage]').forEach(sel => {
    sel.onchange = (e) => {
      const cli = getClient(sel.dataset.quickstage);
      if (cli) {
        cli.stageId = e.target.value;
        saveState();
        renderMainSection();
        showToast(`Клиент «${cli.name}» переведён на этап «${getStage(cli.stageId).name}»`, 'success');
      }
    };
  });

  // HTML5 Drag & Drop для десктопа
  let draggedClientId = null;
  container.querySelectorAll('[data-kcard]').forEach(card => {
    card.ondragstart = () => { draggedClientId = card.dataset.kcard; };
  });
  container.querySelectorAll('[data-stagecol]').forEach(col => {
    col.ondragover = (e) => e.preventDefault();
    col.ondrop = () => {
      if (!draggedClientId) return;
      const cli = getClient(draggedClientId);
      if (cli && cli.stageId !== col.dataset.stagecol) {
        cli.stageId = col.dataset.stagecol;
        saveState();
        renderMainSection();
        showToast(`Сделка «${cli.name}» перемещена в «${getStage(cli.stageId).name}»`, 'success');
      }
    };
  });
}

/**

            const compiled = t.body
              .replace('{client_name}', cli.name.split(' ')[0])
              .replace('{manager_name}', mgr.name.split(' ')[0])
              .replace('{company}', 'OmniDesk Atelier')
              .replace('{product}', cli.company)
              .replace('{price}', cli.dealAmount.toLocaleString('ru-RU') + ' ₽');
            return `
              <div style="border:1px solid var(--border-color);padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:6px">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <b style="font-size:13px">${escapeHtml(t.title)}</b>
                  <span class="tag-pill" style="background:var(--bg-subtle)">${t.type === 'whatsapp_hsm' ? 'HSM WhatsApp' : 'Быстрый ответ'}</span>
                </div>
                <div style="font-size:12.5px;color:var(--text-secondary)">${escapeHtml(compiled)}</div>
                <button class="btn btn-primary btn-sm" style="align-self:flex-end" data-ins-tpl="${escapeHtml(compiled)}" data-ishsm="${t.type === 'whatsapp_hsm'}">Подставить в поле ввода</button>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;

  document.getElementById('close-tpl-modal').onclick = () => { root.innerHTML = ''; };
  root.querySelectorAll('[data-ins-tpl]').forEach(b => {
    b.onclick = () => {
      const prefix = b.dataset.ishsm === 'true' ? '[HSM-ШАБЛОН] ' : '';
      State.drafts[cv.id] = prefix + b.dataset.insTpl;
      State.composerMode = 'reply';
      root.innerHTML = '';
      renderMainSection();
    };
  });
}

function openReassignModal(cv) {
  const cli = getClient(cv.clientId);
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-window" style="max-width:440px">
        <div class="modal-header">
          <div class="modal-title">Передать диалог и клиента коллеге</div>

        </div>
        <div class="modal-body">
          <label style="font-size:12px;font-weight:600">Выберите нового ответственного менеджера:</label>
          <select class="select" id="reas-mgr-select">
            ${State.users.map(u => `<option value="${u.id}" ${u.id === cv.managerId ? 'selected' : ''}>${escapeHtml(u.name)} (${escapeHtml(u.workPhone)})</option>`).join('')}
          </select>
          <label style="font-size:12px;font-weight:600">Комментарий при передаче (сохранится во внутренней заметке):</label>
          <textarea class="textarea" id="reas-comment" rows="2" placeholder="Например: Передаю VIP-клиента на согласование спецусловий"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="btn-confirm-reas">Передать диалог</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('close-reas-modal').onclick = () => { root.innerHTML = ''; };
  document.getElementById('btn-confirm-reas').onclick = () => {
    const newMgrId = document.getElementById('reas-mgr-select').value;
    const comm = document.getElementById('reas-comment').value.trim();
    cv.managerId = newMgrId;
    cli.managerId = newMgrId;
    const newMgr = getUser(newMgrId);
    if (comm) {
      State.messages[cv.id].push({
        id: 'msg_' + Date.now(),
        dir: 'note',
        senderId: getCurrentUser().id,
        time: new Date().toTimeString().slice(0, 5),
        text: `Передача диалога сотруднику @${newMgr.name}: ${comm}`
      });
    }
    logAction(getCurrentUser().name, `Передал диалог с ${cli.name} менеджеру ${newMgr.name}`);

    root.innerHTML = '';
    renderMainSection();
    showToast(`Диалог передан менеджеру ${newMgr.name}`, 'success');

function openAssignTagsModal(cli) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-window" style="max-width:420px">
        <div class="modal-header">
          <div class="modal-title">Теги клиента «${escapeHtml(cli.name)}»</div>
          <button class="btn btn-ghost btn-sm" id="close-tags-modal">✕</button>
        </div>
        <div class="modal-body">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${State.tags.map(tg => {
              const has = (cli.tags || []).includes(tg.id);
              return `<button class="chip ${has ? 'active' : ''}" data-toggletag="${tg.id}">${has ? '✓ ' : '+ '}${escapeHtml(tg.name)}</button>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('close-tags-modal').onclick = () => { root.innerHTML = ''; };
  root.querySelectorAll('[data-toggletag]').forEach(b => {
    b.onclick = () => {
      const tid = b.dataset.toggletag;
      if ((cli.tags || []).includes(tid)) {
        cli.tags = cli.tags.filter(x => x !== tid);
      } else {
        cli.tags = [...(cli.tags || []), tid];
      }
      saveState();
      openAssignTagsModal(cli);
      renderMainSection();
    };
  });
}

function openNewTaskModal(clientId, convId) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-window" style="max-width:440px">
        <div class="modal-header">
          <div class="modal-title">Новая задача / Напоминание</div>
          <button class="btn btn-ghost btn-sm" id="close-ntask-modal">✕</button>
        </div>
        <div class="modal-body">
          <div>
            <label style="font-size:12px;font-weight:600">Описание задачи *</label>
            <input type="text" class="input" id="ntask-title" placeholder="Например: Перезвонить по согласованию счёта" style="margin-top:4px">
          </div>
          <div>
            <label style="font-size:12px;font-weight:600">Дедлайн</label>
            <input type="text" class="input" id="ntask-due" value="Сегодня, 18:00" style="margin-top:4px">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="btn-save-ntask">Создать задачу</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('close-ntask-modal').onclick = () => { root.innerHTML = ''; };
  document.getElementById('btn-save-ntask').onclick = () => {
    const title = document.getElementById('ntask-title').value.trim();
    if (!title) return;
    State.tasks.unshift({
      id: 'tsk_' + Date.now(),
      title,
      clientId,
      convId,
      managerId: getCurrentUser().id,
      due: document.getElementById('ntask-due').value.trim() || 'Сегодня',
      priority: 'high',
      overdue: false,
      done: false
    });
    saveState();
    root.innerHTML = '';
    renderApp();
    showToast('Задача добавлена', 'success');
  };
}

document.getElementById('btn-theme-toggle').onclick = () => {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('meta-theme-color').setAttribute('content', next === 'dark' ? '#111827' : '#ffffff');
};

document.getElementById('btn-toggle-conn').onclick = () => {
  State.wsOnline = !State.wsOnline;
  renderTopUserHeader();
  showToast(
    State.wsOnline
      ? 'Соединение WebSocket восстановлено. Очередь сообщений синхронизирована.'
      : 'Имитация потери сети: новые сообщения ставятся в локальную очередь отправки.',
    State.wsOnline ? 'success' : 'warning'
  );
};

document.getElementById('btn-reset-demo').onclick = () => {
  localStorage.removeItem(STORAGE_KEY);
  State = createInitialDemoState();
  saveState();
  renderApp();
  showToast('Демоданные сброшены к исходному состоянию', 'success');
};
