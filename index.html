  <div style="font-size:11.5px;color:var(--faint);padding:6px 2px 20px">Спектр · прототип омниканальной платформы · версия 0.9-демо · Telegram, MAX и WhatsApp Business — торговые марки их владельцев</div>
 </div>`;
 $('#stSaveP').onclick=()=>{me.name=$('#stName').value||me.name;me.phone=$('#stPhone').value||me.phone;saveSoon();renderRail();Toast.ok('Профиль сохранён','Имя и рабочий номер обновлены')};
 $('#stTheme').onclick=()=>App.toggleTheme();
 $('#stOff').onclick=()=>{state.simOffline=!state.simOffline;saveSoon();setOffline();renderSettings(root)};
 $$('#view [data-sw]').forEach(b=>b.onclick=()=>{s[b.dataset.sw]=!s[b.dataset.sw];b.classList.toggle('on');saveSoon();Toast.ok('Настройка сохранена')});
 $('#stSla').onchange=e=>{s.slaHours=+e.target.value;saveSoon();renderDList&&renderDList();Toast.ok('SLA обновлён',s.slaHours+' часа')};
 $$('#view [data-role]').forEach(sel=>sel.onchange=()=>{const u=UserService.byId(sel.dataset.role);u.role=sel.value;saveSoon();Toast.ok('Роль обновлена',u.name+' — '+sel.options[sel.selectedIndex].text)});
 $('#stExport').onclick=()=>{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state));a.download='spektr-demo-data.json';a.click();Toast.ok('Экспорт готов','Файл JSON скачан')};
 $('#stReset').onclick=()=>Confirm('Сбросить все демоданные к исходному состоянию? Ваши изменения будут удалены.',{danger:1,okText:'Сбросить'},()=>{localStorage.removeItem(LS_KEY);location.reload()});

/* ================================================================
   ГЛОБАЛЬНЫЙ ПОИСК
   ================================================================ */
function openSearch(){
 const ov=$('#searchOv');ov.classList.add('open');
 ov.innerHTML=`<div class="mback"></div><div class="sov-box"><div style="display:flex;align-items:center;gap:8px;padding:0 6px">${''}<input id="sovInp" placeholder="Поиск: клиенты, телефоны, сообщения, теги…" autocomplete="off"></div><div id="sovRes"></div></div>`;
 ov.querySelector('.mback').onclick=()=>ov.classList.remove('open');
 const inp=$('#sovInp');inp.focus();
 inp.oninput=()=>{const q=inp.value.trim().toLowerCase();const box=$('#sovRes');
  if(q.length<2){box.innerHTML='<div style="padding:18px;text-align:center;color:var(--faint);font-size:12.5px">Введите минимум 2 символа</div>';return}
  const cls=state.clients.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.company||'').toLowerCase().includes(q)||(c.tg||'').toLowerCase().includes(q)).slice(0,5);
  const tgs=state.tags.filter(t=>t.name.toLowerCase().includes(q)).slice(0,4);
  const msgs=state.messages.filter(m=>(m.text||'').toLowerCase().includes(q)).slice(0,6);
  const cvss=state.convs.filter(c=>{const cl=ContactService.byId(c.clientId);return cl&&cl.name.toLowerCase().includes(q)}).slice(0,5);
  let html='';
  if(cls.length)html+=`<div class="sov-g">Клиенты</div>`+cls.map(c=>`<div class="sov-i" data-go="cl:${c.id}">${avatarHTML(c.name,'sm')}<div><div class="t1">${esc(c.name)}</div><div class="t2">${esc(c.company)} · ${esc(fmtPhone(c.phone)||c.tg||'')} · ${stageName(c.stage)}</div></div></div>`).join('');
  if(cvss.length)html+=`<div class="sov-g">Диалоги</div>`+cvss.map(c=>{const cl=ContactService.byId(c.clientId);return`<div class="sov-i" data-go="cv:${c.id}"><span style="color:${c.ch==='telegram'?'var(--tg)':c.ch==='whatsapp'?'var(--wa)':'var(--mx)'};display:inline-flex;width:22px">${chIcon(c.ch)}</span><div><div class="t1">${esc(cl.name)}</div><div class="t2">${CH_LABEL[c.ch]} · ${esc(UserService.name(c.owner))}</div></div></div>`}).join('');
  if(msgs.length)html+=`<div class="sov-g">Сообщения</div>`+msgs.map(m=>{const cv=ConversationService.byId(m.convId);const cl=ContactService.byId(cv.clientId);return`<div class="sov-i" data-go="cv:${m.convId}">${I('search')}<div style="min-width:0"><div class="t1">${esc(cl.name)}</div><div class="t2">…${esc(m.text.slice(0,84))}…</div></div></div>`}).join('');
  if(tgs.length)html+=`<div class="sov-g">Теги</div>`+tgs.map(t=>`<div class="sov-i" data-go="tag:${t.id}">${tagHTML(t)}<div><div class="t1">${esc(t.name)}</div><div class="t2">${TagService.usage(t.id)} использований</div></div></div>`).join('');
  box.innerHTML=html||'<div class="empty">'+I('search')+'<b>Ничего не найдено</b></div>';
  box.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{ov.classList.remove('open');const[k,id]=el.dataset.go.split(':');
   if(k==='cl'){App.go('clients');openClientCard(id)}
   if(k==='cv'){App.go('inbox');openChat(id)}
   if(k==='tag'){UI.filters.quick='all';UI.filters.tag=id;App.go('inbox')}});
 };
}

/* ================================================================
   ОФЛАЙН, ГОРЯЧИЕ КЛАВИШИ, ИНИЦИАЛИЗАЦИЯ
   ================================================================ */
function setOffline(){const off=!navigator.onLine||state.simOffline;const b=$('#offlineBar');b.classList.toggle('show',off);b.textContent=off?'⚠ Нет соединения — сообщения будут поставлены в очередь отправки (демо-имитация)':''}
window.addEventListener('online',()=>{setOffline();if(!off0)Toast.ok('Соединение восстановлено','Очередь отправки синхронизирована (демо)')});
window.addEventListener('offline',()=>{setOffline();Toast.warn('Соединение потеряно','Интерфейс продолжает работать локально')});
let off0=false;
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}
 const tag=document.activeElement&&document.activeElement.tagName;
 if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'){if(e.key==='Escape')document.activeElement.blur();return}
 if(e.key==='Escape'){if($('#modalRoot').classList.contains('open'))Modal.close();else if($('#searchOv').classList.contains('open'))$('#searchOv').classList.remove('open');else if($('#drawer').classList.contains('open'))closeDrawer();else if(UI.chat&&window.innerWidth<=900)closeChatMobile();return}
 if(e.key.toLowerCase()==='n'){Wizard.open();return}
 if(e.key.toLowerCase()==='d'){App.toggleTheme();return}
 const map={'1':'inbox','2':'clients','3':'tasks','4':'funnel','5':'analytics'};
 if(map[e.key])App.go(map[e.key]);
});
/* адаптация к виртуальной клавиатуре */
if(window.visualViewport){visualViewport.addEventListener('resize',()=>{document.body.style.height=visualViewport.height+'px'})}

/* запуск */
(async function init(){
 await IDB.open();
 if(!loadState())state=seed();
 if(state.version!==1){state=seed()}
 save();
 off0=!navigator.onLine;
 applyTheme();setOffline();
 App.boot();
 setTimeout(()=>Toast.info('Добро пожаловать в «Спектр»','Демо-прототип: все операции имитируются локально. Нажмите ⌘/Ctrl+K для поиска, N — новый диалог.'),600);
})();
</script>
